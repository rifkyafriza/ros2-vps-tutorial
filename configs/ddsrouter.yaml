# ddsrouter.yaml — Konfigurasi VPS eProsima DDS Router
version: v4.0

# WAN Participant untuk mendengarkan koneksi TCP dari PC (Client)
participants:
  - name: WanParticipant
    kind: wan
    listening-addresses:
      - ip: "<VPS_PUBLIC_IP>"
        port: 11811
        transport: tcp

  - name: LocalParticipant
    kind: local
    domain: 1  # Domain lokal VPS (jika ada ROS2 yang jalan di VPS)
